<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영농기록 사진 검증 | 농작이</title>
  <meta name="description" content="검증코드로 영농기록 사진의 해시·시각·좌표를 대조하고, OpenTimestamps 독립 제3자 인증을 확인합니다.">
  <link rel="stylesheet" href="../style.css">
  <style>
    .verify-form { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 24px; }
    .verify-form input {
      flex: 1; min-width: 180px; padding: 12px 14px; border: 1px solid var(--border);
      border-radius: var(--r); font-size: 16px; letter-spacing: 0.04em;
    }
    .verify-form button {
      padding: 12px 20px; border: 0; border-radius: var(--r); background: var(--primary);
      color: #fff; font-weight: 700; cursor: pointer;
    }
    .verify-form button:disabled { opacity: 0.5; cursor: default; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; font-size: 14px; }
    .kv dt { color: var(--text-3); }
    .kv dd { margin: 0; word-break: break-all; color: var(--text); }
    .hash { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: 13px; font-weight: 700;
    }
    .badge.ok { background: var(--tint); color: var(--primary); }
    .badge.wait { background: #FFF6E5; color: #9A6B00; }
    .badge.fail { background: #FDECEA; color: #C62828; }
    .badge.none { background: #F0F0F0; color: #666; }
    .note { font-size: 13px; color: var(--text-3); margin-top: 12px; }
    .err { color: #C62828; }
    .hidden { display: none; }
    .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
    .actions a, .actions button.linkish {
      font-size: 14px; font-weight: 600;
    }
    button.linkish {
      background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>

<header class="site">
  <div class="inner">
    <a href="/" class="logo">
      <svg viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2C10 2 5 6 5 11C5 13.76 7.24 16 10 16C12.76 16 15 13.76 15 11C15 6 10 2 10 2Z"/>
        <path d="M10 16 L10 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      아그로이드
    </a>
    <nav>
      <a href="/app">농작이 앱</a>
      <a href="/subscribe">구독 안내</a>
      <a href="/business">사업자정보</a>
      <a href="/contact">문의</a>
    </nav>
  </div>
</header>

<main class="narrow">
  <h1>영농기록 사진 검증</h1>
  <p class="lead">
    워터마크의 검증코드(12자)를 입력하거나 QR을 스캔하면, 발급 기록과 해시를 대조합니다.
  </p>

  <form class="verify-form" id="form">
    <input id="code" name="p" maxlength="16" autocomplete="off"
           placeholder="예: A1B2-C3D4-E5F6" aria-label="검증코드">
    <button type="submit" id="go">조회</button>
  </form>
  <p id="status" class="muted"></p>

  <div id="result" class="card hidden">
    <h2>기록 대조</h2>
    <dl class="kv" id="meta"></dl>
  </div>

  <div id="anchor" class="card hidden">
    <h2>독립 제3자 인증</h2>
    <p id="anchorBadge"></p>
    <dl class="kv" id="anchorMeta"></dl>
    <p class="note">
      독립 기관/체인이 이 사진 해시가 해당 시각에 존재했고 변조되지 않았음을 인증합니다.
      직불금 지급·점검 통과를 보장하거나 공식 인정하는 것은 아닙니다.
    </p>
    <div class="actions">
      <button type="button" class="linkish hidden" id="dlOts">.ots 증명 다운로드</button>
      <a href="https://opentimestamps.org" target="_blank" rel="noopener">OpenTimestamps에서 독립 검증 →</a>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCiEdJwGRBIOdgvdIvlPjnWcZSURiXS1Iw",
    authDomain: "farm-machine-manager-prod.firebaseapp.com",
    projectId: "farm-machine-manager-prod",
    storageBucket: "farm-machine-manager-prod.firebasestorage.app",
    messagingSenderId: "810632460995",
    appId: "1:810632460995:web:69aaadbc9dc11a7cf74076"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);
  const form = $("form");
  const codeEl = $("code");
  const statusEl = $("status");
  const resultEl = $("result");
  const metaEl = $("meta");
  const anchorEl = $("anchor");
  const anchorBadge = $("anchorBadge");
  const anchorMeta = $("anchorMeta");
  const dlOts = $("dlOts");

  function normCode(s) {
    return String(s || "").replace(/[^0-9a-fA-F]/g, "").toUpperCase().slice(0, 12);
  }

  function fmtTime(ms) {
    const n = Number(ms);
    if (!n) return "—";
    const d = new Date(n);
    if (Number.isNaN(d.getTime())) return "—";
    return d.toISOString().replace("T", " ").slice(0, 19) + " UTC";
  }

  function kv(dl, rows) {
    dl.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  }

  function setStatus(msg, isErr) {
    statusEl.textContent = msg || "";
    statusEl.className = isErr ? "err" : "muted";
  }

  async function lookup(raw) {
    const code = normCode(raw);
    if (code.length !== 12) {
      setStatus("검증코드 12자를 입력해 주세요.", true);
      return;
    }
    codeEl.value = code.match(/.{1,4}/g).join("-");
    history.replaceState(null, "", "?p=" + encodeURIComponent(code));
    resultEl.classList.add("hidden");
    anchorEl.classList.add("hidden");
    dlOts.classList.add("hidden");
    setStatus("조회 중…");
    $("go").disabled = true;
    try {
      await signInAnonymously(auth);
      const proofSnap = await getDoc(doc(db, "photoProofs", code));
      if (!proofSnap.exists()) {
        setStatus("해당 코드의 기록이 없습니다.", true);
        return;
      }
      const p = proofSnap.data() || {};
      kv(metaEl, [
        ["검증코드", code.match(/.{1,4}/g).join("-")],
        ["원본 해시(SHA-256)", `<span class="hash">${p.hashSha256 || "—"}</span>`],
        ["촬영 시각", fmtTime(p.capturedAt)],
        ["시각 출처", p.timeSource || "—"],
        ["좌표", (p.lat != null && p.lng != null) ? `${p.lat}, ${p.lng}` : "—"],
        ["측위 정확도", p.accuracyM != null ? `±${p.accuracyM} m` : "—"],
        ["필지 판정", p.verdict || "—"],
        ["EXIF 대조", p.exifCheck || "—"],
        ["발급", p.issuer || "농작이"],
      ]);
      resultEl.classList.remove("hidden");

      const aSnap = await getDoc(doc(db, "photoProofs", code, "anchors", "ots"));
      let st = "NONE";
      let a = {};
      if (aSnap.exists()) {
        a = aSnap.data() || {};
        st = a.status || "NONE";
      }
      const badge = {
        ANCHORED: ["ok", "독립 인증 완료 (비트코인 앵커)"],
        PENDING: ["wait", "독립 인증 대기 (비트코인 확정까지 수 시간)"],
        FAILED: ["fail", "독립 인증 실패 — 재시도 대상"],
        NONE: ["none", "아직 독립 제3자 인증이 없습니다"],
      }[st] || ["none", "아직 독립 제3자 인증이 없습니다"];
      anchorBadge.innerHTML = `<span class="badge ${badge[0]}">${badge[1]}</span>`;
      const rows = [
        ["방식", "OpenTimestamps (비트코인 캘린더)"],
        ["제출 시각", a.anchoredAt && a.anchoredAt.toMillis ? fmtTime(a.anchoredAt.toMillis()) : "—"],
      ];
      if (a.otsBtcBlock) rows.push(["비트코인 블록", "#" + a.otsBtcBlock]);
      if (a.otsUpgraded) rows.push(["증명 상태", "완성본 (.ots upgraded)"]);
      else if (st === "PENDING") rows.push(["증명 상태", "캘린더 stub (확정 대기)"]);
      kv(anchorMeta, rows);
      if (a.otsProof) {
        dlOts.classList.remove("hidden");
        dlOts.onclick = () => {
          const bin = Uint8Array.from(atob(a.otsProof), (c) => c.charCodeAt(0));
          const blob = new Blob([bin], { type: "application/vnd.opentimestamps.ots" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = code + ".ots";
          link.click();
          URL.revokeObjectURL(url);
        };
      }
      anchorEl.classList.remove("hidden");
      setStatus("");
    } catch (e) {
      console.warn(e);
      setStatus("조회에 실패했습니다. 네트워크를 확인해 주세요.", true);
    } finally {
      $("go").disabled = false;
    }
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    lookup(codeEl.value);
  });

  const q = new URLSearchParams(location.search).get("p");
  if (q) {
    codeEl.value = q;
    lookup(q);
  }
</script>
</body>
</html>
